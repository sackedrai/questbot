# Настройки линтера (ruff).
# Правила - стандартные питоновские: ошибки, неиспользуемый код, стиль.
# Строку длиннее 100 не ругаем: в этом проекте строки бывают длиннее.

[lint]
select = ["E", "F", "W"]
ignore = [
    "E501",   # длина строки
    "E741",   # неоднозначные имена (l, I, O)
    "E731",   # lambda вместо def
]

[lint.per-file-ignores]
# Инструменты: импорт после sys.path - это норма.
"tools/*" = ["E402"]
