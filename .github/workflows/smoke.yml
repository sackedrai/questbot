# Smoke-тесты: проверка логики, роутинга и остановки поллинга.
#
# Запускается вручную: Actions -> Smoke -> Run workflow.
# Полезен после изменений в коде - прогоняет все наборы тестов
# на настоящем Ubuntu, как в проде.

name: Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: python -m pip install -r requirements.txt

      - name: Проверка каналов
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python tools/check_channels.py

      - name: Тесты
        run: |
          python tools/selftest.py
          python tools/flowtest.py
          python tools/routing_test.py
          python tools/polling_test.py
