# Одноразовая проверка: раннер видит Telegram и токен принят.
name: Smoke

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Проверочное значение (для отладки входных параметров)"
        required: false
        default: "default-value"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Показать входной параметр
        run: echo "MINUTES=${{ inputs.minutes || 'default-value' }}"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: python -m pip install -r requirements.txt

      - name: Проверка каналов
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python tools/check_channels.py

      - name: Тест логики
        run: |
          python tools/selftest.py
          python tools/flowtest.py
          python tools/routing_test.py
          python tools/polling_test.py
